<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cari & Temukan Band - Panggung Lokal</title>
  <meta name="description" content="Cari dan filter band lokal Indonesia berdasarkan genre musik, kota, rentang budget, dan jadwal ketersediaan panggung.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/jpeg" href="/images/logo.jpeg">
  <style>
    .search-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: var(--space-xl);
      align-items: flex-start;
      margin-top: var(--space-xl);
    }
    .filter-panel {
      background-color: var(--surface-card);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      position: sticky;
      top: 90px;
    }
    .filter-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      letter-spacing: 0.5px;
      margin-bottom: var(--space-md);
      color: var(--chalk-white);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .filter-group {
      margin-bottom: var(--space-md);
      padding-bottom: var(--space-md);
      border-bottom: 1px solid var(--surface-border);
    }
    .filter-group:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .filter-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--graphite);
      margin-bottom: 6px;
    }
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      margin-top: var(--space-2xl);
    }
    @media (max-width: 900px) {
      .search-layout {
        grid-template-columns: 1fr;
      }
      .filter-panel {
        position: relative;
        top: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container navbar__inner">
      <a href="/" class="navbar__logo">
        <img src="/images/logo.jpeg" alt="Panggung Lokal Logo" class="navbar__logo-img">
        <span>PANGGUNG</span>
        <span class="navbar__logo-badge">LOKAL</span>
      </a>

      <button class="navbar__toggle" aria-label="Toggle Menu">☰</button>

      <nav>
        <ul class="navbar__menu">
          <li><a href="/" class="navbar__link">Beranda</a></li>
          <li><a href="/search.html" class="navbar__link active">Cari Band</a></li>
        </ul>
      </nav>

      <div id="navbar-auth-container" class="navbar__auth">
        <!-- Injected dynamically by AuthManager -->
      </div>
    </div>
  </header>

  <main class="container section">
    <div class="section-header">
      <div>
        <h1 class="section-header__title">CARI & EKSPLORASI BAND LOKAL</h1>
        <p class="section-header__subtitle">Temukan musisi yang tepat untuk acaramu dengan filter terperinci</p>
      </div>
      <div id="search-count" style="font-family: var(--font-mono); font-size: 0.9rem; color: var(--neon-cyan);">
        Memuat data...
      </div>
    </div>

    <div class="search-layout">
      <!-- Filter Sidebar -->
      <aside class="filter-panel">
        <div class="filter-title">
          <span>FILTER PENCARIAN</span>
          <button id="btn-reset-filters" class="btn btn--outline btn--sm" style="padding: 2px 8px; font-size: 0.75rem;">
            Reset
          </button>
        </div>

        <form id="filter-form">
          <div class="filter-group">
            <label class="filter-label" for="filter-search">Kata Kunci</label>
            <input type="text" id="filter-search" name="search" class="form-control" placeholder="Nama band / deskripsi...">
          </div>

          <div class="filter-group">
            <label class="filter-label" for="filter-genre">Genre Musik</label>
            <select id="filter-genre" name="genre" class="form-control">
              <option value="">Semua Genre</option>
              <option value="Indie">Indie Rock / Alternative</option>
              <option value="Folk">Folk / Akustik</option>
              <option value="Dangdut">Dangdut Koplo Fusion</option>
              <option value="Punk">Hardcore / Punk</option>
              <option value="Jazz">Jazz / Neo-Soul</option>
              <option value="Post-Rock">Post-Rock / Ambient</option>
              <option value="Pop">Pop / Fusion</option>
              <option value="Funk">Funk & Soul</option>
            </select>
          </div>

          <div class="filter-group">
            <label class="filter-label" for="filter-location">Kota / Domisili</label>
            <select id="filter-location" name="location" class="form-control">
              <option value="">Seluruh Kota</option>
              <option value="Bandung">Bandung</option>
              <option value="Jakarta">Jakarta</option>
              <option value="Yogyakarta">Yogyakarta</option>
              <option value="Surabaya">Surabaya</option>
              <option value="Denpasar">Denpasar / Bali</option>
              <option value="Malang">Malang</option>
              <option value="Medan">Medan</option>
            </select>
          </div>

          <div class="filter-group">
            <label class="filter-label">Rentang Budget Fee (Rp)</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
              <input type="number" id="filter-budget-min" name="budgetMin" class="form-control" placeholder="Min (cth: 2jt)" step="500000">
              <input type="number" id="filter-budget-max" name="budgetMax" class="form-control" placeholder="Max (cth: 10jt)" step="500000">
            </div>
          </div>

          <button type="submit" class="btn btn--primary btn--block">
            <span>Terapkan Filter</span>
          </button>
        </form>
      </aside>

      <!-- Results Grid -->
      <section>
        <div id="search-results-grid" class="band-grid">
          <!-- Rendered dynamically -->
        </div>

        <!-- Pagination Controls -->
        <div id="pagination-controls" class="pagination">
          <!-- Rendered dynamically -->
        </div>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer__bottom">
      <div>© 2026 Panggung Lokal. Hubungkan Band Lokal dengan Penyelenggara Acara.</div>
      <a href="/" style="color: var(--neon-cyan);">Kembali ke Beranda</a>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script>
    let currentPage = 1;

    async function loadBands() {
      const grid = document.getElementById('search-results-grid');
      const countEl = document.getElementById('search-count');
      const paginationEl = document.getElementById('pagination-controls');

      grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--graphite);">Mencari band lokal...</div>';

      const searchParams = {
        search: document.getElementById('filter-search').value,
        genre: document.getElementById('filter-genre').value,
        location: document.getElementById('filter-location').value,
        budgetMin: document.getElementById('filter-budget-min').value,
        budgetMax: document.getElementById('filter-budget-max').value,
        page: currentPage,
        limit: 12
      };

      try {
        const res = await apiGetBands(searchParams);
        if (res.success) {
          countEl.textContent = `Menemukan ${res.pagination.total} band`;

          if (res.data.length === 0) {
            grid.innerHTML = `
              <div style="grid-column: 1 / -1; text-align: center; padding: 60px; background: var(--surface-card); border-radius: var(--radius-md); border: 1px solid var(--surface-border);">
                <div style="font-size: 2.5rem; margin-bottom: 10px;">🎸</div>
                <h3 style="font-family: var(--font-display); font-size: 1.6rem; color: var(--chalk-white); margin-bottom: 6px;">TIDAK ADA BAND DITEMUKAN</h3>
                <p style="color: var(--graphite); font-size: 0.95rem;">Coba ubah kriteria filter, lokasi kota, atau rentang budget pencarianmu.</p>
              </div>
            `;
            paginationEl.innerHTML = '';
            return;
          }

          grid.innerHTML = res.data.map(band => {
            const budgetText = (band.budgetMin && band.budgetMax)
              ? `${formatRupiah(band.budgetMin)} - ${formatRupiah(band.budgetMax)}`
              : 'Negosiasi';

            return `
              <div class="band-card">
                <div class="band-card__image-wrap">
                  <img src="${band.profilePhotoUrl || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80'}" 
                       alt="${band.bandName}" class="band-card__image" loading="lazy">
                  <div class="band-card__badges">
                    <span class="badge badge--genre">${band.genre}</span>
                  </div>
                  <div class="band-card__views">👁️ ${band.profileViews} views</div>
                </div>

                <div class="band-card__body">
                  <h3 class="band-card__name">${band.bandName}</h3>
                  <div class="band-card__location">
                    <span>📍</span> <span>${band.locationCity}, ${band.locationRegion || 'Indonesia'}</span>
                  </div>

                  <p class="band-card__bio">${band.bio || 'Musisi independen lokal siap tampil.'}</p>

                  <div class="band-card__footer">
                    <div>
                      <div style="font-size: 0.72rem; color: var(--graphite); text-transform: uppercase;">Estimasi Fee</div>
                      <div class="band-card__price">${budgetText}</div>
                    </div>
                    <a href="/profile.html?id=${band.id}" class="btn btn--primary btn--sm">
                      <span>Lihat Profil</span>
                    </a>
                  </div>
                </div>
              </div>
            `;
          }).join('');

          // Render pagination
          if (res.pagination.totalPages > 1) {
            paginationEl.innerHTML = `
              <button class="btn btn--outline btn--sm" ${res.pagination.page <= 1 ? 'disabled' : ''} onclick="changePage(${res.pagination.page - 1})">
                ← Sebelumnya
              </button>
              <span style="font-family: var(--font-mono); font-size: 0.85rem; color: var(--graphite);">
                Halaman ${res.pagination.page} dari ${res.pagination.totalPages}
              </span>
              <button class="btn btn--outline btn--sm" ${res.pagination.page >= res.pagination.totalPages ? 'disabled' : ''} onclick="changePage(${res.pagination.page + 1})">
                Selanjutnya →
              </button>
            `;
          } else {
            paginationEl.innerHTML = '';
          }
        }
      } catch (err) {
        console.error('Error fetching bands:', err);
        grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #FF5A5F;">Terjadi kesalahan saat memuat data.</div>';
      }
    }

    function changePage(page) {
      currentPage = page;
      loadBands();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Parse URL parameters from homepage search
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('genre')) document.getElementById('filter-genre').value = urlParams.get('genre');
      if (urlParams.has('location')) document.getElementById('filter-location').value = urlParams.get('location');
      if (urlParams.has('search')) document.getElementById('filter-search').value = urlParams.get('search');

      loadBands();

      document.getElementById('filter-form').addEventListener('submit', (e) => {
        e.preventDefault();
        currentPage = 1;
        loadBands();
      });

      document.getElementById('btn-reset-filters').addEventListener('click', () => {
        document.getElementById('filter-form').reset();
        currentPage = 1;
        loadBands();
      });
    });
  </script>
</body>
</html>
