<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Panggung Lokal</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
  <style>
    .auth-page {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-2xl) var(--space-md);
    }
    .auth-card {
      background-color: var(--surface-card);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      padding: var(--space-2xl);
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container navbar__inner">
      <a href="/" class="navbar__logo">
        <img src="/images/logo.jpeg" alt="Panggung Lokal Logo" class="navbar__logo-img">
        <span>PANGGUNG</span>
        <span class="navbar__logo-badge">LOKAL</span>
      </a>
      <div id="navbar-auth-container" class="navbar__auth">
        <a href="/login.html" class="btn btn--outline btn--sm">Masuk</a>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: var(--space-xl);">
        <h1 style="font-family: var(--font-display); font-size: 2.2rem; letter-spacing: 1px; color: var(--chalk-white);">
          ATUR PASSWORD BARU
        </h1>
        <p style="color: var(--graphite); font-size: 0.9rem; margin-top: 4px;">
          Masukkan kata sandi baru untuk akun Anda
        </p>
      </div>

      <form id="reset-form">
        <input type="hidden" id="reset-token">

        <div class="form-group">
          <label class="form-label" for="new-password">Password Baru *</label>
          <input type="password" id="new-password" class="form-control" placeholder="Minimal 6 karakter" minlength="6" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Konfirmasi Password Baru *</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="Ulangi password baru" minlength="6" required>
        </div>

        <button type="submit" id="btn-submit-reset" class="btn btn--primary btn--block btn--lg" style="margin-top: var(--space-lg);">
          <span>Perbarui Password</span>
        </button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__bottom">
      <div>© 2026 Panggung Lokal.</div>
    </div>
  </footer>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      if (!token) {
        showToast('Token reset password tidak ditemukan di URL', 'error');
      } else {
        document.getElementById('reset-token').value = token;
      }

      document.getElementById('reset-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const tokenVal = document.getElementById('reset-token').value;
        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (newPassword !== confirmPassword) {
          showToast('Konfirmasi password tidak cocok', 'error');
          return;
        }

        const btn = document.getElementById('btn-submit-reset');
        btn.disabled = true;

        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: tokenVal, newPassword })
          });
          const data = await res.json();
          if (data.success) {
            showToast('Password berhasil diubah! Mengalihkan ke login...', 'success');
            setTimeout(() => window.location.href = '/login.html', 1500);
          } else {
            showToast(data.message || 'Gagal mereset password', 'error');
            btn.disabled = false;
          }
        } catch (err) {
          showToast('Terjadi kesalahan koneksi', 'error');
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
