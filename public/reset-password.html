<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0D0D0D">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D0D0D">
  <meta name="color-scheme" content="dark">
  <title>Atur Kata Sandi - Panggung Lokal</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
  <style>
    .auth-page {
      min-height: calc(100vh - 160px);
      min-height: calc(100dvh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-2xl) var(--space-md);
    }
    .auth-card {
      animation: cascadeEnter var(--spring-duration) var(--spring-easing) both;
      will-change: transform, opacity;
      background-color: var(--surface-card);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      padding: var(--space-2xl);
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
    }
    @media (max-width: 480px) {
      .auth-page {
        padding: var(--space-md) var(--space-sm);
        min-height: calc(100dvh - 120px);
      }
      .auth-card {
        padding: var(--space-lg) var(--space-md);
        border-radius: var(--radius-md);
      }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container navbar__inner">
      <a href="/" class="navbar__logo" aria-label="Panggung Lokal">
        <img src="/images/logo.png" alt="Panggung Lokal Logo" class="navbar__logo-img">
      </a>
      <div id="navbar-auth-container" class="navbar__auth">
        <a href="/login.html" class="btn btn--outline btn--sm">Masuk</a>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: var(--space-xl);">
        <h1 style="font-family: var(--font-display); font-size: 2.2rem; letter-spacing: 1px; color: var(--chalk-white);">
          ATUR KATA SANDI BARU
        </h1>
        <p style="color: var(--graphite); font-size: 0.9rem; margin-top: 4px;">
          Masukkan kata sandi baru untuk akun.
        </p>
      </div>

      <form id="reset-form">
        <input type="hidden" id="reset-token">

        <div class="form-group">
          <label class="form-label" for="new-password">Kata Sandi Baru *</label>
          <input type="password" id="new-password" class="form-control" placeholder="Minimal 6 karakter" minlength="6" autocomplete="new-password" enterkeyhint="next" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Ulangi Kata Sandi Baru *</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="Ketik ulang kata sandi baru" minlength="6" autocomplete="new-password" enterkeyhint="done" required>
        </div>

        <button type="submit" id="btn-submit-reset" class="btn btn--primary btn--block btn--lg" style="margin-top: var(--space-lg);">
          <span>Simpan Kata Sandi</span>
        </button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__bottom">
      <div>© 2026 Panggung Lokal.</div>
    </div>
  </footer>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      if (!token) {
        showToast('Token reset password tidak ditemukan di URL', 'error');
      } else {
        document.getElementById('reset-token').value = token;
      }

      document.getElementById('reset-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const tokenVal = document.getElementById('reset-token').value;
        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (newPassword !== confirmPassword) {
          showToast('Konfirmasi password tidak cocok', 'error');
          return;
        }

        const btn = document.getElementById('btn-submit-reset');
        btn.disabled = true;

        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: tokenVal, newPassword })
          });
          const data = await res.json();
          if (data.success) {
            showToast('Kata sandi berhasil diperbarui', 'success');
            setTimeout(() => window.location.href = '/login.html', 1500);
          } else {
            showToast(data.message || 'Gagal mereset password', 'error');
            btn.disabled = false;
          }
        } catch (err) {
          showToast('Terjadi kesalahan koneksi', 'error');
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
