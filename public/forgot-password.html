<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0D0D0D">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D0D0D">
  <meta name="color-scheme" content="dark">
  <title>Lupa Kata Sandi - Panggung Lokal</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
  <style>
    .auth-page {
      min-height: calc(100vh - 160px);
      min-height: calc(100dvh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-2xl) var(--space-md);
    }
    .auth-card {
      animation: cascadeEnter var(--spring-duration) var(--spring-easing) both;
      will-change: transform, opacity;
      background-color: var(--surface-card);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      padding: var(--space-2xl);
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
    }
    @media (max-width: 480px) {
      .auth-page {
        padding: var(--space-md) var(--space-sm);
        min-height: calc(100dvh - 120px);
      }
      .auth-card {
        padding: var(--space-lg) var(--space-md);
        border-radius: var(--radius-md);
      }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container navbar__inner">
      <a href="/" class="navbar__logo" aria-label="Panggung Lokal">
        <img src="/images/logo.png" alt="Panggung Lokal Logo" class="navbar__logo-img">
      </a>
      <div id="navbar-auth-container" class="navbar__auth">
        <a href="/login.html" class="btn btn--outline btn--sm">Masuk</a>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: var(--space-xl);">
        <h1 style="font-family: var(--font-display); font-size: 2.2rem; letter-spacing: 1px; color: var(--chalk-white);">
          LUPA KATA SANDI
        </h1>
        <p style="color: var(--graphite); font-size: 0.9rem; margin-top: 4px;">
          Ketik alamat email akun untuk menerima tautan pembuatan kata sandi baru.
        </p>
      </div>

      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label" for="forgot-email">Email</label>
          <input type="email" id="forgot-email" class="form-control" placeholder="nama@email.com" autocomplete="email" inputmode="email" autocapitalize="none" autocorrect="off" enterkeyhint="send" required>
        </div>

        <button type="submit" id="btn-submit-forgot" class="btn btn--primary btn--block btn--lg" style="margin-top: var(--space-lg);">
          <span>Kirim Tautan</span>
        </button>
      </form>

      <div id="reset-result-box" style="display: none; margin-top: var(--space-lg); padding: 14px; background: rgba(0, 217, 255, 0.1); border: 1px solid var(--neon-cyan); border-radius: var(--radius-md);">
        <div style="font-weight: 600; color: var(--neon-cyan); margin-bottom: 6px;">Tautan Reset Kata Sandi:</div>
        <p style="font-size: 0.85rem; color: var(--chalk-white); margin-bottom: 10px;">Klik tautan berikut untuk membuat kata sandi baru:</p>
        <a id="reset-link" href="#" class="btn btn--secondary btn--sm btn--block">Buka Halaman Reset Kata Sandi</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__bottom">
      <div>© 2026 Panggung Lokal.</div>
      <a href="/login.html" style="color: var(--neon-cyan);">Masuk</a>
    </div>
  </footer>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('forgot-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('forgot-email').value.trim();
        const btn = document.getElementById('btn-submit-forgot');
        btn.disabled = true;

        try {
          const res = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await res.json();
          if (data.success) {
            showToast('Instruksi reset password berhasil dibuat', 'success');
            if (data.resetToken) {
              const box = document.getElementById('reset-result-box');
              const link = document.getElementById('reset-link');
              link.href = `/reset-password.html?token=${data.resetToken}`;
              box.style.display = 'block';
            }
          } else {
            showToast(data.message || 'Gagal memproses permintaan', 'error');
            btn.disabled = false;
          }
        } catch (err) {
          showToast('Terjadi kesalahan koneksi', 'error');
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
