<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk Akun - Panggung Lokal</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/jpeg" href="/images/logo.jpeg">
  <style>
    .auth-page {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-2xl) var(--space-md);
    }
    .auth-card {
      background-color: var(--surface-card);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      padding: var(--space-2xl);
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
      position: relative;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 15%;
      right: 15%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--electric-crimson), transparent);
    }
    .demo-box {
      margin-top: var(--space-xl);
      padding-top: var(--space-md);
      border-top: 1px dashed var(--surface-border);
    }
    .demo-btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container navbar__inner">
      <a href="/" class="navbar__logo">
        <img src="/images/logo.jpeg" alt="Panggung Lokal Logo" class="navbar__logo-img">
        <span>PANGGUNG</span>
        <span class="navbar__logo-badge">LOKAL</span>
      </a>
      <div id="navbar-auth-container" class="navbar__auth">
        <a href="/register.html" class="btn btn--outline btn--sm">Daftar Akun Baru</a>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: var(--space-xl);">
        <img src="/images/logo.jpeg" alt="Panggung Lokal" style="width: 76px; height: 76px; object-fit: cover; border-radius: var(--radius-md); margin: 0 auto var(--space-sm); border: 2px solid var(--electric-crimson); box-shadow: 0 0 16px var(--crimson-glow); display: block;">
        <h1 style="font-family: var(--font-display); font-size: 2.2rem; letter-spacing: 1px; color: var(--chalk-white);">
          MASUK KE PANGGUNG LOKAL
        </h1>
        <p style="color: var(--graphite); font-size: 0.9rem; margin-top: 4px;">
          Kelola profil band atau hubungi musisi lokal
        </p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Alamat Email</label>
          <input type="email" id="login-email" class="form-control" placeholder="nama@email.com" required>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" for="login-password" style="margin-bottom: 0;">Password</label>
            <a href="/forgot-password.html" style="font-size: 0.8rem; color: var(--neon-cyan);">Lupa Password?</a>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="btn-submit-login" class="btn btn--primary btn--block btn--lg" style="margin-top: var(--space-lg);">
          <span>Masuk Sekarang</span>
        </button>
      </form>

      <div style="text-align: center; margin-top: var(--space-md); font-size: 0.9rem; color: var(--graphite);">
        Belum punya akun? <a href="/register.html" style="color: var(--neon-cyan); font-weight: 600;">Daftar di sini</a>
      </div>

      <!-- Demo Accounts for Easy Testing -->
      <div class="demo-box">
        <div style="font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; color: var(--gold-foil); text-align: center; font-weight: 700;">
          ⚡ DEMO LOGIN 1-KLIK (UNTUK PENGUJIAN)
        </div>
        <div class="demo-btn-grid">
          <button type="button" class="btn btn--secondary btn--sm" onclick="demoLogin('kelana@panggunglokal.id', 'Password123!')">
            🎸 Band Kelana
          </button>
          <button type="button" class="btn btn--secondary btn--sm" onclick="demoLogin('senjabersuara@panggunglokal.id', 'Password123!')">
            🎸 Band Senja
          </button>
          <button type="button" class="btn btn--secondary btn--sm" onclick="demoLogin('kafe.selatan@gmail.com', 'Password123!')">
            🎪 Penyelenggara
          </button>
          <button type="button" class="btn btn--secondary btn--sm" onclick="demoLogin('admin@admin.com', 'admin')">
            📊 Admin KPI
          </button>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__bottom">
      <div>© 2026 Panggung Lokal.</div>
      <a href="/" style="color: var(--neon-cyan);">Kembali ke Beranda</a>
    </div>
  </footer>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script>
    async function doLogin(email, password) {
      const btn = document.getElementById('btn-submit-login');
      btn.disabled = true;
      btn.textContent = 'Memverifikasi...';

      try {
        const res = await AuthManager.login(email, password);
        if (res.success) {
          showToast('Login berhasil! Mengalihkan...', 'success');
          setTimeout(() => {
            if (res.user.accountType === 'band') {
              window.location.href = '/dashboard-band.html';
            } else if (res.user.accountType === 'admin') {
              window.location.href = '/admin.html';
            } else {
              window.location.href = '/dashboard-organizer.html';
            }
          }, 800);
        } else {
          showToast(res.message || 'Login gagal', 'error');
          btn.disabled = false;
          btn.textContent = 'Masuk Sekarang';
        }
      } catch (err) {
        showToast('Terjadi kesalahan koneksi', 'error');
        btn.disabled = false;
        btn.textContent = 'Masuk Sekarang';
      }
    }

    function demoLogin(email, password) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = password;
      doLogin(email, password);
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        doLogin(email, password);
      });
    });
  </script>
</body>
</html>
