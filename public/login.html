<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0D0D0D">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D0D0D">
  <meta name="color-scheme" content="dark">
  <title>Masuk Akun - Reffband | Panggung Lokal</title>
  <meta name="description" content="Masuk ke akun Reffband untuk musisi dan penyelenggara acara.">
  <link rel="canonical" href="https://reffband.studio/login.html">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <style>
    .auth-page {
      min-height: calc(100vh - 160px);
      min-height: calc(100dvh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-2xl) var(--space-md);
    }
    .auth-card {
      animation: cascadeEnter var(--spring-duration) var(--spring-easing) both;
      will-change: transform, opacity;
      background-color: var(--surface-card);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      padding: var(--space-2xl);
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
      position: relative;
    }
    @media (max-width: 480px) {
      .auth-page {
        padding: var(--space-md) var(--space-sm);
        min-height: calc(100dvh - 120px);
      }
      .auth-card {
        padding: var(--space-lg) var(--space-md);
        border-radius: var(--radius-md);
      }
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 15%;
      right: 15%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--electric-crimson), transparent);
    }
    .demo-box {
      margin-top: var(--space-xl);
      padding-top: var(--space-md);
      border-top: 1px dashed var(--surface-border);
    }
    .demo-btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container navbar__inner">
      <a href="/" class="navbar__logo" aria-label="Panggung Lokal">
        <img src="/images/logo.png" alt="Panggung Lokal Logo" class="navbar__logo-img">
      </a>
      <div id="navbar-auth-container" class="navbar__auth">
        <a href="/register.html" class="btn btn--outline btn--sm">Daftar Akun</a>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: var(--space-xl);">
        <h1 style="font-family: var(--font-display); font-size: 2.2rem; letter-spacing: 1px; color: var(--chalk-white);">
          MASUK
        </h1>
        <p style="color: var(--graphite); font-size: 0.9rem; margin-top: 4px;">
          Masukkan alamat email dan kata sandi akun.
        </p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email</label>
          <input type="email" id="login-email" class="form-control" placeholder="nama@email.com" autocomplete="email" inputmode="email" autocapitalize="none" autocorrect="off" enterkeyhint="next" required>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" for="login-password" style="margin-bottom: 0;">Kata Sandi</label>
            <a href="/forgot-password.html" style="font-size: 0.8rem; color: var(--neon-cyan);">Lupa Kata Sandi?</a>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" autocomplete="current-password" enterkeyhint="done" required>
        </div>

        <button type="submit" id="btn-submit-login" class="btn btn--primary btn--block btn--lg" style="margin-top: var(--space-lg);">
          <span>Masuk</span>
        </button>
      </form>

      <div style="text-align: center; margin-top: var(--space-md); font-size: 0.9rem; color: var(--graphite);">
        Belum punya akun? <a href="/register.html" style="color: var(--neon-cyan); font-weight: 600;">Daftar</a>
      </div>

      <!-- Demo Accounts for Easy Testing -->
      <div class="demo-box">
        <div style="font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; color: var(--gold-foil); text-align: center; font-weight: 700;">
          DEMO LOGIN PENGUJIAN
        </div>
        <div class="demo-btn-grid">
          <button type="button" class="btn btn--secondary btn--sm" onclick="demoLogin('kelana@panggunglokal.id', 'Password123!')">
            Band Kelana
          </button>
          <button type="button" class="btn btn--secondary btn--sm" onclick="demoLogin('senjabersuara@panggunglokal.id', 'Password123!')">
            Band Senja
          </button>
          <button type="button" class="btn btn--secondary btn--sm" onclick="demoLogin('kafe.selatan@gmail.com', 'Password123!')">
            EO/Umum
          </button>
          <button type="button" class="btn btn--secondary btn--sm" onclick="prepareAdminLogin()">
            Admin
          </button>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__bottom">
      <div>© 2026 Panggung Lokal.</div>
      <a href="/" style="color: var(--neon-cyan);">Beranda</a>
    </div>
  </footer>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script>
    async function doLogin(email, password) {
      const btn = document.getElementById('btn-submit-login');
      btn.disabled = true;
      btn.textContent = 'Memverifikasi...';

      try {
        const res = await AuthManager.login(email, password);
        if (res.success) {
          showToast('Login berhasil. Mengalihkan...', 'success');
          setTimeout(() => {
            if (res.user.accountType === 'band') {
              window.location.href = '/dashboard-band.html';
            } else if (res.user.accountType === 'admin') {
              window.location.href = '/admin.html';
            } else {
              window.location.href = '/search.html';
            }
          }, 800);
        } else {
          showToast(res.message || 'Login gagal', 'error');
          btn.disabled = false;
          btn.textContent = 'Masuk';
        }
      } catch (err) {
        showToast('Terjadi kesalahan koneksi', 'error');
        btn.disabled = false;
        btn.textContent = 'Masuk';
      }
    }

    function demoLogin(email, password) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = password;
      doLogin(email, password);
    }

    function prepareAdminLogin() {
      const emailInput = document.getElementById('login-email');
      const passInput = document.getElementById('login-password');
      emailInput.value = '';
      passInput.value = '';
      emailInput.focus();
      showToast('Silakan masukkan email dan kata sandi admin secara manual', 'info');
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        doLogin(email, password);
      });
    });
  </script>
</body>
</html>
